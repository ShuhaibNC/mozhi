<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mozhi - Malayalam Dictionary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@400;600;800&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="theme-init.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* VS Code Dark+ */
    :root {
      --bg:        #1e1e1e;
      --surface:   #252526;
      --titlebar:  #323233;
      --glass:     rgba(255,255,255,0.04);
      --glass-hov: rgba(255,255,255,0.07);
      --border:    #3c3c3c;
      --border-hi: #505050;
      --blue:      #569cd6;
      --violet:    #c586c0;
      --cyan:      #4ec9b0;
      --accent:    #007acc;
      --focus:     #007fd4;
      --sel:       #04395e;
      --text:      #d4d4d4;
      --text-2:    #9d9d9d;
      --text-3:    #6e7681;
      --radius:    6px;
      --radius-sm: 4px;
    }

    /* Site themes — same ids as shuhaibnc.github.io (default = the VS Code
       Dark+ look above). Picked in the palette menu, top right. */
    html[data-site-theme='amoled'] {
      color-scheme: dark;
      --bg: #000000; --surface: #0a0a0a; --titlebar: #111111;
      --glass: rgba(255,255,255,0.04); --glass-hov: rgba(255,255,255,0.07);
      --border: #262626; --border-hi: #333333;
      --blue: #64b5f6; --violet: #ba68c8; --cyan: #4ec9b0;
      --accent: #64b5f6; --focus: #42a5f5; --sel: #0d2b45;
      --text: #f2f2f2; --text-2: #b3b3b3; --text-3: #808080;
    }
    html[data-site-theme='midnight'] {
      color-scheme: dark;
      --bg: #0a1128; --surface: #0d1530; --titlebar: #111c3d;
      --glass: rgba(255,255,255,0.04); --glass-hov: rgba(255,255,255,0.07);
      --border: #1e2a52; --border-hi: #2a3a68;
      --blue: #7cb3ff; --violet: #b39ddb; --cyan: #4dd0e1;
      --accent: #7cb3ff; --focus: #5b9dff; --sel: #16294d;
      --text: #e6ebf5; --text-2: #aab6d3; --text-3: #7c8aa8;
    }
    html[data-site-theme='forest'] {
      color-scheme: dark;
      --bg: #0a1a12; --surface: #0d2118; --titlebar: #12291d;
      --glass: rgba(255,255,255,0.04); --glass-hov: rgba(255,255,255,0.07);
      --border: #1e3d2c; --border-hi: #2a5240;
      --blue: #81c784; --violet: #ba68c8; --cyan: #4db6ac;
      --accent: #4ade80; --focus: #22c55e; --sel: #123f27;
      --text: #e6f2ea; --text-2: #a9c4b2; --text-3: #7a9a86;
    }
    html[data-site-theme='mocha'] {
      color-scheme: dark;
      --bg: #1e1e2e; --surface: #181825; --titlebar: #11111b;
      --glass: rgba(255,255,255,0.04); --glass-hov: rgba(255,255,255,0.07);
      --border: #313244; --border-hi: #45475a;
      --blue: #89b4fa; --violet: #cba6f7; --cyan: #94e2d5;
      --accent: #cba6f7; --focus: #b48cf5; --sel: #313244;
      --text: #cdd6f4; --text-2: #bac2de; --text-3: #a6adc8;
    }
    html[data-site-theme='paper'] {
      color-scheme: light;
      --bg: #faf7f0; --surface: #fffdf7; --titlebar: #f3eee3;
      --glass: rgba(0,0,0,0.03); --glass-hov: rgba(0,0,0,0.06);
      --border: #ddd5c2; --border-hi: #cfc5ac;
      --blue: #92400e; --violet: #7c3aed; --cyan: #0f766e;
      --accent: #b45309; --focus: #92400e; --sel: #f3e5c8;
      --text: #2b2620; --text-2: #57503f; --text-3: #7d7462;
    }

    /* Customisation: text size, density, corner radius (same prefs as the site) */
    html[data-font-size='small'] { font-size: 15px; }
    html[data-font-size='large'] { font-size: 18px; }
    html[data-density='compact'] .panel-head { padding: 0.45rem 0.8rem; }
    html[data-density='compact'] .sug-item { padding: 0.35rem 0.8rem; }
    html[data-density='compact'] .meaning-item { padding: 0.35rem 0.75rem 0.35rem 1.5rem; }
    html[data-density='compact'] .grid { gap: 0.8rem; }
    html[data-density='compact'] #searchInput { padding: 0.65rem 1rem 0.65rem 3rem; }
    html[data-radius='sharp'] { --radius: 2px; --radius-sm: 2px; }
    html[data-radius='rounded'] { --radius: 16px; --radius-sm: 12px; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* ── TOPBAR ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem;
      background: var(--titlebar);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Baloo Chettan 2', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--blue);
      user-select: none;
    }

    .topbar-right { display: flex; align-items: center; gap: 1.25rem; }

    .about-btn {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-2);
      background: none;
      border: 1px solid var(--border);
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
    }
    .about-btn:hover { color: var(--text); border-color: var(--border-hi); background: var(--glass); }

    /* ── THEME PICKER (same as shuhaibnc.github.io) ── */
    .theme-wrap { position: relative; display: flex; align-items: center; }
    .theme-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.15s;
    }
    .theme-btn:hover { color: var(--text); border-color: var(--border-hi); background: var(--glass-hov); }
    .theme-panel {
      position: absolute; top: 44px; right: 0;
      width: min(300px, calc(100vw - 32px));
      display: none; flex-direction: column; gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      z-index: 300;
    }
    .theme-panel.open { display: flex; }
    .tp-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      font-size: 0.85rem; font-weight: 600; color: var(--text-2);
    }
    .tp-row select {
      font-family: inherit; font-size: 0.85rem;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 8px; cursor: pointer;
    }
    .accents { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
    .accents button {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer; padding: 0;
    }
    .accents button.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--accent); }
    .accents button.none {
      background: var(--bg); border-color: var(--border); color: var(--text-2);
      font-size: 11px; line-height: 1;
    }
    .tp-reset {
      align-self: flex-end;
      font-family: inherit; font-size: 0.8rem; font-weight: 600;
      padding: 6px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--glass); color: var(--text); cursor: pointer;
    }
    .tp-reset:hover { border-color: var(--border-hi); }

    /* ── LOADER OVERLAY ── */
    #loader {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2rem;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .loader-logo {
      font-family: 'Baloo Chettan 2', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(120deg, var(--blue), var(--violet), var(--cyan));
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shiftGrad 2s linear infinite;
    }
    @keyframes shiftGrad { 0%{background-position:0%} 100%{background-position:200%} }

    .loader-bar-wrap {
      width: 240px;
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .loader-bar {
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .loader-status {
      font-family: 'DM Mono', Consolas, monospace;
      font-size: 0.78rem;
      color: var(--text-3);
      min-height: 1.2em;
      text-align: center;
    }

    .loader-dots { display: inline-flex; gap: 6px; align-items: center; }
    .loader-dots span {
      width: 6px; height: 6px;
      background: var(--blue);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .loader-dots span:nth-child(2) { animation-delay: 0.2s; background: var(--violet); }
    .loader-dots span:nth-child(3) { animation-delay: 0.4s; background: var(--cyan); }
    @keyframes bounce { 0%,80%,100%{transform:scale(0.6);opacity:0.4} 40%{transform:scale(1);opacity:1} }

    /* ── MAIN LAYOUT ── */
    .page {
      position: relative; z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 2rem 3rem;
    }

    /* ── SEARCH ── */
    .search-wrap { position: relative; margin-bottom: 2rem; }

    .search-icon {
      position: absolute; left: 1.1rem; top: 50%; transform: translateY(-50%);
      color: var(--text-3);
      pointer-events: none;
      transition: color 0.2s;
    }
    .search-wrap:focus-within .search-icon { color: var(--focus); }

    .search-kbd {
      position: absolute; right: 1.1rem; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px;
      font-family: 'DM Mono', Consolas, monospace;
      font-size: 0.72rem;
      color: var(--text-3);
      background: var(--glass);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: var(--radius-sm);
    }

    #searchInput {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3rem;
      font-family: inherit;
      font-size: 1.05rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    #searchInput::placeholder { color: var(--text-3); }
    #searchInput:focus { border-color: var(--focus); }
    #searchInput:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 1.25rem;
      height: 480px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .panel-head {
      padding: 0.7rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 0.6rem;
      flex-shrink: 0;
    }
    .panel-head-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-2);
    }
    .panel-head-count {
      font-family: 'DM Mono', Consolas, monospace;
      font-size: 0.7rem;
      color: #fff;
      background: var(--accent);
      padding: 1px 7px;
      border-radius: 99px;
      display: none;
    }
    .panel-head-count.visible { display: block; }

    .panel-body { flex: 1; overflow-y: auto; padding: 0.4rem; }
    .panel-body::-webkit-scrollbar { width: 10px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(121,121,121,0.4); }
    .panel-body::-webkit-scrollbar-thumb:hover { background: rgba(121,121,121,0.7); }

    /* ── EMPTY STATE ── */
    .empty {
      height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.75rem;
      color: var(--text-3);
      text-align: center;
      padding: 2rem;
    }
    .empty-icon { font-size: 2.5rem; opacity: 0.4; }
    .empty-text { font-size: 0.85rem; line-height: 1.5; }

    /* ── SUGGESTIONS ── */
    .sug-item {
      padding: 0.55rem 0.8rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--text-2);
      transition: background 0.1s, color 0.1s;
    }
    .sug-item:hover { background: var(--glass-hov); color: var(--text); }
    .sug-item.active {
      background: var(--sel);
      color: var(--text);
      outline: 1px solid var(--focus);
      outline-offset: -1px;
    }

    .sug-item mark { background: none; color: var(--blue); font-weight: 700; }

    /* ── MEANING ── */
    .word-title {
      font-family: 'Baloo Chettan 2', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--cyan);
      margin-bottom: 1rem;
      padding: 0.25rem 0.5rem;
    }

    .meanings-list { list-style: none; padding: 0 0.25rem; }

    .meaning-item {
      font-family: 'Baloo Chettan 2', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      padding: 0.55rem 0.75rem 0.55rem 1.5rem;
      position: relative;
      border-radius: var(--radius-sm);
      line-height: 1.65;
      transition: background 0.1s;
    }
    .meaning-item:hover { background: var(--glass); }
    .meaning-item::before {
      content: '';
      position: absolute;
      left: 0.5rem; top: 50%; transform: translateY(-50%);
      width: 5px; height: 5px;
      background: var(--blue);
      border-radius: 50%;
    }

    /* ── MODAL ── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 8px;
      padding: 2.25rem;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .modal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.75rem; color: var(--blue); }
    .modal-body { font-size: 0.9rem; color: var(--text-2); line-height: 1.8; margin-bottom: 1.75rem; }
    .modal-body a { color: var(--blue); text-decoration: none; }
    .modal-btn {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.5rem 1.75rem;
      border-radius: var(--radius-sm);
      background: var(--accent);
      border: none;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .modal-btn:hover { opacity: 0.88; }

    /* ── STAT BAR ── */
    .stat-bar {
      display: flex; align-items: center; justify-content: center; gap: 2rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }
    .stat {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-3);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .stat.visible { opacity: 1; }
    .stat-val { font-family: 'DM Mono', Consolas, monospace; font-size: 0.85rem; color: var(--cyan); font-weight: 500; }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; height: auto; }
      .panel { height: 280px; }
      .page { padding: 68px 1rem 2rem; }
      .stat-bar { gap: 1rem; }
    }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-logo">മൊഴി</div>
  <div class="loader-dots">
    <span></span><span></span><span></span>
  </div>
  <div class="loader-bar-wrap">
    <div class="loader-bar" id="loaderBar"></div>
  </div>
  <div class="loader-status" id="loaderStatus">Initializing…</div>
</div>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo"><a href="/" style="text-decoration: none; color: inherit;">മൊഴി</a></div>
  <div class="topbar-right">
    <button class="about-btn" onclick="openModal()">About</button>
    <div class="theme-wrap">
      <button class="theme-btn" id="themeBtn" aria-label="Theme settings" aria-haspopup="true" aria-expanded="false" title="Theme settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.04 10 9c0 3-2.5 5-5 5H12c-1.66 0-3 1.34-3 3 0 1.5.5 3 3 3z"/><circle cx="13.5" cy="6.5" r="1" fill="currentColor" stroke="none"/><circle cx="17.5" cy="10.5" r="1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="7.5" r="1" fill="currentColor" stroke="none"/><circle cx="6.5" cy="12.5" r="1" fill="currentColor" stroke="none"/></svg></button>
      <div class="theme-panel" id="themePanel">
        <label class="tp-row">Theme
          <select id="themeSel" aria-label="Theme">
            <option value="default">Default</option>
            <option value="amoled">AMOLED</option>
            <option value="midnight">Midnight</option>
            <option value="forest">Forest</option>
            <option value="mocha">Catppuccin Mocha</option>
            <option value="paper">Paper</option>
          </select>
        </label>
        <div class="tp-row"><span>Accent</span><span class="accents" id="accentRow" aria-label="Accent colour"></span></div>
        <label class="tp-row">Text size
          <select id="fontSizeSel" aria-label="Text size">
            <option value="small">Small</option>
            <option value="default">Default</option>
            <option value="large">Large</option>
          </select>
        </label>
        <label class="tp-row">Density
          <select id="densitySel" aria-label="Density">
            <option value="comfortable">Comfortable</option>
            <option value="compact">Compact</option>
          </select>
        </label>
        <label class="tp-row">Corners
          <select id="radiusSel" aria-label="Corner radius">
            <option value="default">Default</option>
            <option value="sharp">Sharp</option>
            <option value="rounded">Rounded</option>
          </select>
        </label>
        <button class="tp-reset" id="themeReset" type="button">Reset</button>
      </div>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="page">

  <div class="stat-bar" id="statBar">
    <div class="stat" id="statWords">
      <span>Words</span>
      <span class="stat-val" id="statWordCount">—</span>
    </div>
    <div class="stat" id="statLang">
      <span>Lang</span>
      <span class="stat-val">EN → ML</span>
    </div>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search for a word…" autocomplete="off" spellcheck="false" disabled />
    <div class="search-kbd">↵ Enter</div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-head-title">Suggestions</span>
        <span class="panel-head-count" id="sugCount"></span>
      </div>
      <div class="panel-body" id="sugBody">
        <div class="empty">
          <div class="empty-icon">🔍</div>
          <div class="empty-text">Start typing to see suggestions</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-head-title">Meaning</span>
      </div>
      <div class="panel-body" id="meanBody">
        <div class="empty">
          <div class="empty-icon">📖</div>
          <div class="empty-text">Select a word to view its meaning</div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ABOUT MODAL -->
<div class="modal-backdrop" id="modal" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-title">About മൊഴി</div>
    <div class="modal-body">
      An English–Malayalam dictionary.<br/>
      Built by <strong>ShuhaibNC</strong><br/>
      Dataset by <a href="https://nadh.in" target="_blank">Kailash Nadh</a>
    </div>
    <button class="modal-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  /* ── Theme + customisation ──
     Same prefs as shuhaibnc.github.io (key 'shuhaib-site-prefs-v1'), so a
     theme picked on the main site follows the visitor here, and vice
     versa. theme-init.js already applied the saved prefs before first
     paint; this wires up the picker. */
  const PREFS_KEY = 'shuhaib-site-prefs-v1';
  const ACCENT_PRESETS = ['#3b82f6', '#0284c7', '#8b5cf6', '#ec4899', '#22c55e', '#14b8a6', '#f59e0b', '#ef4444'];
  function readPrefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {}; } catch { return {}; } }
  function applyPrefs(p) {
    const r = document.documentElement;
    r.dataset.siteTheme = p.theme || 'default';
    r.dataset.fontSize = p.fontSize || 'default';
    r.dataset.density = p.density || 'comfortable';
    r.dataset.radius = p.radius || 'default';
    if (p.accent) { r.style.setProperty('--accent', p.accent); r.style.setProperty('--focus', p.accent); }
    else { r.style.removeProperty('--accent'); r.style.removeProperty('--focus'); }
  }
  function renderThemePanel() {
    const prefs = readPrefs();
    document.getElementById('themeSel').value = prefs.theme || 'default';
    document.getElementById('fontSizeSel').value = prefs.fontSize || 'default';
    document.getElementById('densitySel').value = prefs.density || 'comfortable';
    document.getElementById('radiusSel').value = prefs.radius || 'default';
    const row = document.getElementById('accentRow');
    row.innerHTML = '';
    const saveAndApply = p => { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch {} applyPrefs(p); renderThemePanel(); };
    const none = document.createElement('button');
    none.type = 'button'; none.className = 'none' + (!prefs.accent ? ' active' : '');
    none.textContent = '✕'; none.title = 'Theme default accent'; none.setAttribute('aria-label', 'Theme default accent');
    none.addEventListener('click', () => { const p = readPrefs(); p.accent = ''; saveAndApply(p); });
    row.appendChild(none);
    ACCENT_PRESETS.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.style.background = c; b.title = c; b.setAttribute('aria-label', 'Accent ' + c);
      if (prefs.accent === c) b.className = 'active';
      b.addEventListener('click', () => { const p = readPrefs(); p.accent = c; saveAndApply(p); });
      row.appendChild(b);
    });
  }
  function bindPrefSelect(id, key) {
    document.getElementById(id).addEventListener('change', function () {
      const p = readPrefs(); p[key] = this.value;
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch {}
      applyPrefs(p);
    });
  }
  // One-time migration: the old light/dark toggle stored 'theme'.
  try {
    if (!localStorage.getItem(PREFS_KEY) && localStorage.getItem('theme') === 'light') {
      const p = readPrefs(); p.theme = 'paper';
      localStorage.setItem(PREFS_KEY, JSON.stringify(p));
    }
  } catch {}
  applyPrefs(readPrefs());
  renderThemePanel();
  bindPrefSelect('themeSel', 'theme');
  bindPrefSelect('fontSizeSel', 'fontSize');
  bindPrefSelect('densitySel', 'density');
  bindPrefSelect('radiusSel', 'radius');
  document.getElementById('themeReset').addEventListener('click', () => {
    try { localStorage.removeItem(PREFS_KEY); } catch {}
    applyPrefs({}); renderThemePanel();
  });
  document.getElementById('themeBtn').addEventListener('click', e => {
    e.stopPropagation();
    const panel = document.getElementById('themePanel');
    const open = panel.classList.toggle('open');
    document.getElementById('themeBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.theme-wrap')) document.getElementById('themePanel').classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('themePanel').classList.remove('open');
  });

  /* ── Modal ── */
  function openModal() { document.getElementById('modal').classList.add('open'); }
  function closeModal(e) {
    if (!e || e.target === document.getElementById('modal')) {
      document.getElementById('modal').classList.remove('open');
    }
  }

  /* ── Loader helpers ── */
  let loaderProgress = 0;
  function setProgress(p, msg) {
    loaderProgress = Math.max(loaderProgress, p);
    document.getElementById('loaderBar').style.width = loaderProgress + '%';
    if (msg) document.getElementById('loaderStatus').textContent = msg;
  }

  function hideLoader() {
    const l = document.getElementById('loader');
    l.classList.add('hidden');
    setTimeout(() => l.remove(), 700);
  }

  /* ── Dictionary ── */
  let dict = {}, allWords = [], ready = false, activeWord = null, currentHits = [];

  async function loadDict() {
    setProgress(5, 'Fetching dictionary file…');
    try {
      const res = await fetch('enml.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      setProgress(30, 'Downloading data…');

      const len = parseInt(res.headers.get('Content-Length') || '0');
      let received = 0;
      const reader = res.body.getReader();
      const chunks = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (len) setProgress(30 + Math.round((received / len) * 45), 'Downloading data…');
      }
      setProgress(75, 'Parsing JSON…');

      await new Promise(r => setTimeout(r, 30));

      const raw = new TextDecoder().decode(
        new Uint8Array(chunks.reduce((acc, c) => { const n = new Uint8Array(acc.length + c.length); n.set(acc); n.set(c, acc.length); return n; }, new Uint8Array(0)))
      );
      dict = JSON.parse(raw);

      setProgress(92, 'Building index…');
      await new Promise(r => setTimeout(r, 20));
      allWords = Object.keys(dict).sort();

      setProgress(100, `Ready — ${allWords.length.toLocaleString()} words`);

      document.getElementById('statWordCount').textContent = allWords.length.toLocaleString();
      document.querySelectorAll('.stat').forEach(s => s.classList.add('visible'));

      ready = true;
      const inp = document.getElementById('searchInput');
      inp.disabled = false;
      inp.placeholder = 'Search for a word…';

      await new Promise(r => setTimeout(r, 350));
      hideLoader();
      inp.focus();

    } catch (err) {
      setProgress(100, '');
      document.getElementById('loaderStatus').innerHTML =
        `<span style="color:#f48771">Failed: ${err.message}</span>`;
      document.getElementById('sugBody').innerHTML =
        `<div class="empty"><div class="empty-icon">❌</div><div class="empty-text">Could not load enml.json<br/><small>${err.message}</small></div></div>`;
      setTimeout(hideLoader, 2500);
    }
  }

  /* ── Search ── */
  function search() {
    if (!ready) return;
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const body = document.getElementById('sugBody');
    const cnt  = document.getElementById('sugCount');

    if (!q) {
      currentHits = [];
      body.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Start typing to see suggestions</div></div>`;
      cnt.textContent = ''; cnt.classList.remove('visible');
      return;
    }

    const hits = allWords.filter(w => w.toLowerCase().startsWith(q)).slice(0, 60);
    currentHits = hits;

    if (!hits.length) {
      body.innerHTML = `<div class="empty"><div class="empty-icon">🤷</div><div class="empty-text">No matches found</div></div>`;
      cnt.textContent = ''; cnt.classList.remove('visible');
      return;
    }

    cnt.textContent = hits.length === 60 ? '60+' : hits.length;
    cnt.classList.add('visible');

    const esc = s => s.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    const boldQ = w => {
      const i = w.toLowerCase().indexOf(q);
      if (i === -1) return esc(w);
      return esc(w.slice(0,i)) + '<mark>' + esc(w.slice(i, i+q.length)) + '</mark>' + esc(w.slice(i+q.length));
    };

    body.innerHTML = hits.map((w,i) =>
      `<div class="sug-item${w === activeWord ? ' active' : ''}"
            onclick="selectWord('${w.replace(/'/g,"\\'")}')">
         ${boldQ(w)}
       </div>`
    ).join('');
  }

  function selectWord(word) {
    activeWord = word;
    const meanings = dict[word] || [];
    const body = document.getElementById('meanBody');

    if (!meanings.length) {
      body.innerHTML = `<div class="empty"><div class="empty-icon">❓</div><div class="empty-text">No meanings found</div></div>`;
    } else {
      body.innerHTML =
        `<div class="word-title">${word}</div>
         <ul class="meanings-list">
           ${meanings.map(m => `<li class="meaning-item">${m}</li>`).join('')}
         </ul>`;
    }

    document.querySelectorAll('.sug-item').forEach(el => {
      const on = el.textContent.trim() === word;
      el.classList.toggle('active', on);
      if (on) el.scrollIntoView({ block: 'nearest' });
    });
  }

  /* Enter / arrows cycle through suggestions */
  function step(dir) {
    if (!currentHits.length) return;
    const i = currentHits.indexOf(activeWord);
    const n = currentHits.length;
    const next = i === -1 ? (dir > 0 ? 0 : n - 1) : (i + dir + n) % n;
    selectWord(currentHits[next]);
  }

  /* ── Input events ── */
  const inp = document.getElementById('searchInput');
  inp.addEventListener('input', search);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter')     { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
    if (e.key === 'ArrowDown') { e.preventDefault(); step(1); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); step(-1); }
    if (e.key === 'Escape')    { inp.value = ''; search(); }
  });

  /* ── Boot ── */
  loadDict();
</script>
</body>
</html>
